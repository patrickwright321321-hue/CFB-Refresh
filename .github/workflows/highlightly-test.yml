name: Highlightly Compatibility Test

on:
  workflow_dispatch:

jobs:
  highlightly-test:
    runs-on: ubuntu-latest
    env:
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Highlightly secret is configured
        run: |
          python - <<'PY'
          import os
          if not os.getenv("HIGHLIGHTLY_API_KEY"):
              raise SystemExit("HIGHLIGHTLY_API_KEY is not configured")
          print("Highlightly API key is configured.")
          PY

      - name: Run compatibility test scaffold
        run: python src/highlightly_test.py
